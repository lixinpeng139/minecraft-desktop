<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' mcd:; style-src 'self' 'unsafe-inline'; script-src 'self' mcd:">
<title>Minecraft 桌面 - 下载资源</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; color: #fff; user-select: none;
    background: #2b2b2b repeating-conic-gradient(#313131 0 25%, #2b2b2b 0 50%) 0 0 / 32px 32px;
    display: flex; flex-direction: column; padding: 26px 34px 20px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; text-shadow: 2px 2px #3f3f3f; }
  p { margin: 0; color: #c8c8c8; font-size: 13px; line-height: 1.6; }
  .small { color: #8c8c8c; font-size: 12px; }

  #progress { margin-top: 28px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  #step { font-size: 14px; text-shadow: 2px 2px #3f3f3f; }
  #percent { font-size: 26px; font-weight: bold; text-shadow: 2px 2px #3f3f3f; font-variant-numeric: tabular-nums; }
  /* 与 Minecraft 加载界面相同风格的进度条：白色边框 + 白色填充 */
  .bar { height: 14px; border: 2px solid #fff; padding: 2px; background: #000; }
  .bar > div { height: 100%; width: 0; background: #fff; transition: width .15s linear; }
  .bar.err > div { background: #ff5555; }
  .stats { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #c8c8c8; font-variant-numeric: tabular-nums; }
  #source { margin-top: 4px; font-size: 12px; color: #8c8c8c; }

  #error { display: none; margin-top: 14px; color: #ff5555; font-size: 13px; line-height: 1.5; }
  .btn {
    display: none; width: 200px; margin: 12px auto 0; padding: 7px 12px; font: inherit; font-size: 14px; color: #fff;
    text-shadow: 2px 2px #3f3f3f; cursor: pointer;
    background: linear-gradient(#8a8a8a, #6f6f6f); border: 2px solid #000;
    box-shadow: inset 2px 2px #a8a8a8, inset -2px -3px #555;
  }
  .btn:hover { border-color: #fff; }
  footer { margin-top: auto; }
</style>
</head>
<body>
  <h1>正在准备 Minecraft 桌面</h1>
  <p>界面使用 Minecraft Java 版的原版贴图、字体和音效，需要先从 Mojang 官方服务器下载一次（约 30 MB）。下载完成后会自动进入桌面。</p>

  <div id="progress">
    <div class="head"><span id="step">正在连接…</span><span id="percent">0%</span></div>
    <div class="bar" id="bar"><div></div></div>
    <div class="stats"><span id="size">&nbsp;</span><span id="speed">&nbsp;</span></div>
    <div id="source">&nbsp;</div>
  </div>

  <div id="error"></div>
  <button class="btn" id="retry">重试</button>

  <footer><p class="small">资源只保存在这台电脑上，仅供你自己使用。Minecraft 是 Mojang Studios 的商标，本程序与 Mojang、Microsoft 无关。</p></footer>
  <script src="js/setup.js"></script>
</body>
</html>
