<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' mcd:; img-src 'self' mcd: data:; media-src mcd:; style-src 'self' 'unsafe-inline'; script-src 'self' mcd:">
<title>Minecraft Desktop</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: default; user-select: none; }
  canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
  #bg-img { display: none; }
  #ime { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; outline: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bg-pano"></canvas>
<canvas id="bg-img"></canvas>
<canvas id="hud"></canvas>
<canvas id="gui"></canvas>
<input id="ime" type="text" autocomplete="off" spellcheck="false">
<script type="module" src="js/app-desktop.js"></script>
</body>
</html>
